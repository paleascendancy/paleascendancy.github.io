Session:true,autoRefreshToken:true,detectSessionInUrl:true}});const out=document.getElementById("editorPublicContent");const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");const map={promo:"Promo",trailer:"Trailers",highlight:"Highlights",motion:"Motion Design",anime:"Anime / Mangá",gaming:"Gaming",tiktok:"TikTok",reels:"Reels",amv:"AMV",thumbnail:"Thumbnails",youtube:"YouTube",outros:"Outros"};async function load(){const id=new URLSearchParams(location.search).get("id");if(!id){out.innerHTML='<h1>Perfil não encontrado.</h1><a class="primary-button" href="editores.html">Voltar aos editores</a>';return;}const {data:p,error}=await client.from("editor_directory").select("id,nome_artistico,especialidade,bio,avatar_url,tiktok,instagram,youtube,discord,editor_categories,portfolio_url,editor_software,availability,is_featured").eq("id",id).maybeSingle();if(error||!p){out.innerHTML='<h1>Perfil não encontrado.</h1><p>Este editor pode não estar mais publicado na rede.</p><a class="primary-button" href="editores.html">Voltar aos editores</a>';return;}const cats=[...new Set([p.especialidade,...(p.editor_categories||[])].filter(Boolean))];const avatar=p.avatar_url?`<img class="editor-public-avatar" src="${esc(p.avatar_url)}" alt="Foto de ${esc(p.nome_artistico||"Editor")}">`:`<div class="editor-public-avatar placeholder-icon">${esc((p.nome_artistico||"E").charAt(0).toUpperCase())}</div>`;const links=[["TikTok",p.tiktok],["Instagram",p.instagram],["YouTube",p.youtube],["Portfólio",p.portfolio_url]].filter(x=>x[1]);out.innerHTML=`<div class="editor-public-top">${avatar}<div><p class="editor-status"><span class="status-dot"></span>${p.is_featured?"Editor em destaque":"Editor aprovado"}</p><h1>${esc(p.nome_artistico||"Editor")}</h1><div class="editor-role">${esc(map[p.especialidade]||p.especialidade||"EDITOR")}</div></div></div><p class="editor-public-bio">${esc(p.bio||"Este editor ainda não
