<body><header class="header"><a class="brand" href="index.html"><img src="pale-ascendancy-logo.png" alt="Pale Ascendancy" width="36" height="36"><span>PALE ASCENDANCY</span></a><nav class="nav"><a href="index.html">Home</a><a href="editores.html">Editores &amp; Designers</a><a href="servicos.html">Serviços</a></nav><button class="menu-button" id="menuButton" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="mobileMenu"><span class="menu-icon"></span></button></header>

<main class="auth-page"><div class="hero-glow"></div><section class="profile-view editor-public-profile" id="editorPublicProfile"><p class="eyebrow">Pale Ascendancy · Perfil profissional</p><div id="editorPublicContent"><p>Carregando perfil...</p></div></section></main>
<footer><div class="footer-brand"><img src="pale-ascendancy-logo.png" alt="Pale Ascendancy" width="28" height="28"><span>PALE ASCENDANCY</span></div><small>© 2026 Pale Ascendancy. Todos os direitos reservados.</small><div class="footer-legal"><a href="privacidade.html">Privacidade</a><a href="termos.html">Termos</a></div></footer>
<script src="script.js?v=24"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const client=window.supabase.createClient("https://fnyellunugdfesprmvzm.supabase.co","sb_publishable_clf6HlhhxdftO1_XZU7YsA_pRmkCEJK",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const out=document.getElementById("editorPublicContent");
const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
const map={promo:"Promo",trailer:"Trailers",highlight:"Highlights",motion:"Motion Design",anime:"Anime / Mangá",gaming:"Gaming",tiktok:"TikTok",reels:"Reels",amv:"AMV",thumbnail:"Thumbnails",youtube:"YouTube",design:"Design Gráfico",branding:"Branding",uiux:"UI / UX",illustration:"Ilustração","3d":"3D",outros:"Outros"};
const role=p=>p.is_editor&&p.is_designer?"EDITOR + DESIGNER":p.is_designer?"DESIGNER":"EDITOR"; const plans={free:"GRATUITO",premium:"PREMIUM",pro:"PRO",studio:"STUDIO",elite:"ELITE"}; function activePlan(p){const code=String(p.professional_plan||"free").toLowerCase();const active=code!=="free"&&String(p.plan_status||"").toLowerCase()==="active"&&(!p.plan_expires_at||new Date(p.plan_expires_at)>new Date());return active&&plans[code]?code:"free";}
function portfolioMarkup(items){if(!items?.length)return '<div class="portfolio-public-empty"><strong>Portfólio em construção.</strong><span>Este profissional ainda não adicionou trabalhos.</span></div>';return `<div class="portfolio-public-grid">${items.map(item=>{const type=item.item_type;const media=type==="image"?`<img src="${esc(item.url)}" alt="${esc(item.title)}" loading="lazy">`:type==="video"?`<video src="${esc(item.url)}" controls preload="metadata" playsinline></video>`:`<a class="portfolio-public-link" href="${esc(item.url)}" target="_blank" rel="noopener noreferrer"><span>↗</span><strong>Abrir projeto</strong><small>${esc(item.url)}</small></a>`;return `<article class="portfolio-public-item"><div class="portfolio-public-media">${media}</div><div class="portfolio-public-copy"><span class="portfolio-type-label">${type==="image"?"FOTO / ARTE":type==="video"?"VÍDEO":"PROJETO"}</span><h3>${esc(item.title)}</h3>${item.description?`<p>${esc(item.description)}</p>`:""}${type!=="link"?`<a class="card-link" href="${esc(item.url)}" target="_blank" rel="noopener noreferrer">Abrir em tela cheia →</a>`:""}</div></article>`}).join("")}</div>`;}
async function load(){const id=new URLSearchParams(location.search).get("id");if(!id){out.innerHTML='<h1>Perfil não encontrado.</h1><a class="primary-button" href="editores.html">Voltar</a>';return;}const {data:p,error}=await client.from("editor_directory").select("id,nome_artistico,especialidade,bio,avatar_url,tiktok,instagram,youtube,discord,editor_categories,portfolio_url,editor_software,availability,is_featured,is_editor,is_designer,professional_plan,plan_status,plan_expires_at").eq("id",id).maybeSingle();if(error||!p){out.innerHTML='<h1>Perfil não encontrado.</h1><p>Este profissional pode não estar mais publicado na rede.</p><a class="primary-button" href="editores.html">Voltar</a>';return;}const {data:items}=await client.from("editor_portfolio_items").select("id,title,description,item_type,url,sort_order,created_at").eq("editor_id",id).order("sort_order",{ascending:true}).order("created_at",{ascending:false});const cats=[...new Set([p.especialidade,...(p.editor_categories||[])].filter(Boolean))];const avatar=p.avatar_url?`<img class="editor-public-avatar" src="${esc(p.avatar_url)}" alt="Foto de ${esc(p.nome_artistico||"Profissional")}">`:`<div class="editor-public-avatar placeholder-icon">${esc((p.nome_artistico||"P").charAt(0).toUpperCase())}</div>`;const links=[["TikTok",p.tiktok],["Instagram",p.instagram],["YouTube",p.youtube],["Portfólio externo",p.portfolio_url]].filter(x=>x[1]);out.innerHTML=`<div class="editor-public-top">${avatar}<div><p class="editor-status"><span class="status-dot"></span>${p.is_featured?"Profissional em destaque":role(p)+" aprovado"}</p><h1>${esc(p.nome_artistico||"Profissional")}</h1><div class="editor-role">${role(p)}</div>${activePlan(p)!=="free"?`<span class="plan-badge-public">${plans[activePlan(p)]} · PLANO ATIVO</span>`:""}</div></div></div><p class="editor-public-bio">${esc(p.bio||"Este profissional ainda não adicionou uma descrição.")}</p><div class="editor-tags">${cats.map(c=>`<span class="editor-tag">${esc(map[c]||c)}</span>`).join("")}</div>${p.editor_software?`<div class="profile-info"><span class="profile-label">Ferramentas</span><strong>${esc(p.editor_software)}</strong></div>`:""}${p.availability?`<div class="profile-info"><span class="profile-label">Disponibilidade</span><strong>${esc(p.availability==="disponivel"?"Disponível":p.availability==="ocupado"?"Ocupado no momento":"Sob consulta")}</strong></div>`:""}<section class="portfolio-public-section"><div class="section-heading"><p class="eyebrow">Trabalhos</p><h2>Portfólio <span>profissional.</span></h2><p>Projetos, artes, imagens e vídeos selecionados por este profissional.</p></div>${portfolioMarkup(items||[])}</section><div class="profile-socials">${links.map(([label,url])=>`<a class="secondary-button" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${label} →</a>`).join("")}</div><div class="editor-public-actions"><a class="primary-button" href="editores.html">Ver outros profissionais</a><a class="secondary-button" href="quero-ser-editor.html">Quero entrar na rede</a></div>`;}
load();
</script></body></html>
